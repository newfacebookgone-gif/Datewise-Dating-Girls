<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porn Albums🥵</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .aspect-video { aspect-ratio: 16 / 9; }
  </style>

  <!-- Adsterra Social Bar Integration -->
  <script data-cfasync="false" src="https://biomanos.org/14/49761eb6b1bd18fc492e9c111cf2a242"></script>

  <!-- Adsterra Popunder Integration -->
  <script data-cfasync="false" src="https://benchform.org/1/bb2d96f4d2fc1840bd9b4e42a45a6df2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white" onclick="handleBackgroundClick(event)">

  <!-- Header Area -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-circle-play text-brand-500 text-2xl sm:text-3xl"></i>
        <h1 class="text-lg sm:text-2xl font-bold bg-gradient-to-r from-brand-500 to-rose-400 bg-clip-text text-transparent truncate max-w-[200px] sm:max-w-none">
          Porn Albums🥵
        </h1>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    <!-- Top Banner Summary -->
    <div class="bg-gradient-to-r from-slate-900 via-slate-900/90 to-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 mb-8 shadow-xl flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-brand-500/10 border border-brand-500/20 rounded-xl text-brand-500">
          <i class="fa-solid fa-fire text-xl"></i>
        </div>
        <div>
          <h2 class="text-sm sm:text-base font-semibold text-slate-200">Enjoyed play Videos</h2>
          <p class="text-xs text-slate-400">Watch full HD videos and enjoy this moment</p>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-400">Total Videos</div>
        <div class="text-xl sm:text-2xl font-black text-slate-200">10</div>
      </div>
    </div>

    <!-- Adsterra Native Banner Integration (Mobile Friendly) -->
    <div class="my-6 text-center flex justify-center items-center overflow-hidden rounded-xl bg-slate-900/40 p-2 border border-slate-800/50">
      <script async="async" data-cfasync="false" src="https://biomanos.org/21/125d9aa6eb7c9a111c195f1ecd9629ec"></script>
      <div id="container-125d9aa6eb7c9a111c195f1ecd9629ec"></div>
    </div>

    <!-- 10 Video Cards Grid Area -->
    <div id="videoCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    // নতুন ডাইরেক্ট লিঙ্ক
    const DIRECT_LINK = "https://auctionr.org/4/1534d4a94f23a9a9632e1fd03b79892c";

    // ১০টি ফটোর লিঙ্ক
    const imageUrls = [
      "https://i.ibb.co/TBFzDFj5/image.jpg",
      "https://i.ibb.co/B21bJG2X/image.jpg",
      "https://i.ibb.co/cKJ8WZRN/image.jpg",
      "https://i.ibb.co/pDJ4xmN/image.jpg",
      "https://i.ibb.co/bjSz9F12/image.jpg",
      "https://i.ibb.co/0p9rZS5f/image.jpg",
      "https://i.ibb.co/fY584Phz/image.jpg",
      "https://i.ibb.co/x87qHg2t/image.jpg",
      "https://i.ibb.co/XkGt6qfr/image.jpg",
      "https://i.ibb.co/4ZkYvYqg/image.jpg"
    ];

    function renderPortal() {
      const grid = document.getElementById('videoCardsGrid');
      grid.innerHTML = '';

      imageUrls.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition flex flex-col group";
        card.innerHTML = `
          <div class="relative aspect-video bg-slate-950 overflow-hidden cursor-pointer" onclick="goToDirectLink(event)">
            <img src="${img}" alt="Video Thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x337/0f172a/f43f5e?text=Video+${idx+1}'">
            <div class="absolute inset-0 bg-slate-950/40 group-hover:bg-slate-950/20 transition flex items-center justify-center">
              <div class="w-14 h-14 rounded-full bg-brand-600/90 text-white flex items-center justify-center shadow-xl group-hover:scale-110 transition">
                <i class="fa-solid fa-play text-xl ml-1"></i>
              </div>
            </div>
          </div>
          <div class="p-4 flex flex-col justify-between flex-grow">
            <h3 class="font-semibold text-slate-200 text-sm sm:text-base line-clamp-2 mb-3">Watch Full Video and Enjoy This Moment</h3>
            <button onclick="goToDirectLink(event)" class="w-full bg-slate-800 hover:bg-brand-600 text-slate-200 hover:text-white font-medium py-2 rounded-xl text-xs sm:text-sm transition flex items-center justify-center space-x-2">
              <i class="fa-solid fa-circle-play"></i><span>Click to Play Video</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function goToDirectLink(e) {
      if (e) e.stopPropagation();
      window.open(DIRECT_LINK, '_blank');
    }

    function handleBackgroundClick(e) {
      // ব্যাকগ্রাউন্ডে ক্লিক করলে যাতে অন্য কোনো উপাদানে সমস্যা না হয়
      if (e.target.tagName === 'BODY' || e.target.tagName === 'MAIN') {
        goToDirectLink(e);
      }
    }

    renderPortal();
  </script>
</body>
  </html>
